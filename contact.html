<body class="bg-stone-50 text-slate-800">

    <!-- contact form -->
     <section class="px-4 py-10 md:py-16">
  <div class="mx-auto max-w-3xl rounded-3xl border border-emerald-100 bg-white px-6 py-10 shadow-lg md:px-12">
      <h2 class="mb-4 text-center text-4xl font-extrabold tracking-tight text-emerald-950">Contact us</h2>
      <p class="mb-10 text-center text-slate-600 sm:text-lg">Have a question or feedback? We would love to hear from you.</p>
      <form action="#" class="space-y-8">
          <div>
              <label for="email" class="mb-2 block text-sm font-semibold text-emerald-950">Your email</label>
              <input type="email" id="email" class="block w-full rounded-xl border border-emerald-200 bg-stone-50 p-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100" placeholder="name@example.com" required>
          </div>
          <div>
              <label for="subject" class="mb-2 block text-sm font-semibold text-emerald-950">Subject</label>
              <input type="text" id="subject" class="block w-full rounded-xl border border-emerald-200 bg-stone-50 p-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100" placeholder="How can we help?" required>
          </div>
          <div class="sm:col-span-2">
              <label for="message" class="mb-2 block text-sm font-semibold text-emerald-950">Your message</label>
              <textarea id="message" rows="6" class="block w-full rounded-xl border border-emerald-200 bg-stone-50 p-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100" placeholder="Write your message..." required></textarea>
          </div>
          <button type="submit" class="rounded-full bg-emerald-800 px-7 py-3 font-semibold text-white shadow-sm transition hover:bg-emerald-950 focus:outline-none focus:ring-4 focus:ring-emerald-200">Send message</button>
      </form>
  </div>
</section>
    <!-- foote section -->

    <div class="flex flex-col gap-3 rounded-t-3xl bg-emerald-950 p-8 text-white">
        <h2 class="text-2xl font-bold">Greeden</h2>

            quae molestiae alias earum.</p>

    </div>
</body>
